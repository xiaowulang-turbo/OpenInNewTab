<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Open In New Tab - Whitelist Manager</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="container">
            <header class="header">
                <h1 id="modalTitle">Whitelist Management</h1>
                <div class="header-buttons">
                    <button
                        id="settingsButton"
                        class="settings-btn"
                        title="Settings"
                    >
                        ⚙️
                    </button>
                </div>
            </header>

            <main class="main-content">
                <!-- Quick Add Current Domain Section -->
                <div class="quick-add-section" id="quickAddSection">
                    <div class="current-domain-card">
                        <div class="domain-info">
                            <span class="domain-label" id="currentDomainLabel"
                                >Current Domain:</span
                            >
                            <span class="domain-value" id="currentDomainValue"
                                >Loading...</span
                            >
                        </div>
                        <button
                            id="quickAddBtn"
                            class="quick-add-btn"
                            title="Add current domain to whitelist"
                        >
                            <span id="quickAddBtnText">Add</span>
                        </button>
                    </div>
                </div>

                <div class="domains-section">
                    <div class="section-title" id="whitelistTitle">
                        Whitelist
                    </div>
                    <div id="domainsList" class="domains-list">
                        <!-- Domains will be added here -->
                    </div>
                </div>
            </main>
        </div>

        <!-- Settings Modal -->
        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="settingsTitle">Settings</h2>
                    <button id="modalCloseBtn" class="modal-close-btn">
                        &times;
                    </button>
                </div>
                <div class="modal-body">
                    <!-- Theme Setting -->
                    <div class="setting-item">
                        <label class="setting-label" id="themeLabel"
                            >Theme</label
                        >
                        <div class="theme-toggle-group">
                            <button
                                class="theme-option"
                                data-theme="light"
                                id="themeLightBtn"
                            >
                                <span class="theme-icon">☀️</span>
                                <span class="theme-text" id="themeLightText"
                                    >Light</span
                                >
                            </button>
                            <button
                                class="theme-option"
                                data-theme="dark"
                                id="themeDarkBtn"
                            >
                                <span class="theme-icon">🌙</span>
                                <span class="theme-text" id="themeDarkText"
                                    >Dark</span
                                >
                            </button>
                            <button
                                class="theme-option"
                                data-theme="auto"
                                id="themeAutoBtn"
                            >
                                <span class="theme-icon">🔄</span>
                                <span class="theme-text" id="themeAutoText"
                                    >Auto</span
                                >
                            </button>
                        </div>
                    </div>

                    <!-- Language Setting -->
                    <div class="setting-item">
                        <label class="setting-label" id="languageLabel"
                            >Language</label
                        >
                        <select id="languageSelect" class="language-select">
                            <option value="en">English</option>
                            <option value="zh">中文</option>
                        </select>
                    </div>

                    <!-- Open in background -->
                    <div class="setting-item setting-item-row">
                        <div class="setting-copy">
                            <span
                                class="setting-label setting-label-inline"
                                id="openInBackgroundLabel"
                                >Open in background</span
                            >
                            <span
                                class="setting-description"
                                id="openInBackgroundDesc"
                                >Keep focus on the current tab when opening
                                links</span
                            >
                        </div>
                        <label class="toggle-switch" title="Open in background">
                            <input
                                type="checkbox"
                                id="openInBackgroundToggle"
                            />
                            <span class="toggle-slider" aria-hidden="true"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
